# ============================================================
# MySQL Secret (base64 encoded credentials)
# To generate: echo -n 'yourvalue' | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  mysql-root-password: cm9vdHBhc3N3b3Jk       # rootpassword
  mysql-database: aW52ZW50b3J5X2Ri             # inventory_db
  mysql-username: cm9vdA==                      # root
---
# ============================================================
# MySQL Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
          - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-database
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        emptyDir: {}
---
# ============================================================
# MySQL Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
---
# ============================================================
# Spring Boot App - Argo Rollout (Canary)
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inventory-app

spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: inventory-app
  strategy:
    canary:
      canaryService: inventory-app-canary
      stableService: inventory-app
      trafficRouting:
        istio:
          virtualService:
            name: inventory-app-vs
            routes:
            - primary
          destinationRule:
            name: inventory-app-dr
            canarySubsetName: canary
            stableSubsetName: stable
      steps:
      - setWeight: 20
      - pause: {duration: 30s}
      - setWeight: 40
      - pause: {duration: 30s}
      - setWeight: 60
      - pause: {duration: 30s}
      - setWeight: 80
      - pause: {duration: 30s}
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done; echo "MySQL is ready!"']
      containers:
      - name: inventory-app
        image: taledevendra/my-app:81
        ports:
          - containerPort: 8087
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        imagePullPolicy: Always
        readinessProbe:
          httpGet:
            path: /testmydev/actuator/health
            port: 8087
          initialDelaySeconds: 30
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /testmydev/actuator/health
            port: 8087
          initialDelaySeconds: 60
          periodSeconds: 30
---
# ============================================================
# Stable Service (receives production traffic)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
spec:
  type: ClusterIP
  selector:
    app: inventory-app
  ports:
  - port: 8087
    targetPort: 8087
    protocol: TCP
    name: http
---
# ============================================================
# Canary Service (receives canary traffic during rollout)
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: inventory-app-canary
spec:
  type: ClusterIP
  selector:
    app: inventory-app
  ports:
  - port: 8087
    targetPort: 8087
    protocol: TCP
    name: http
---
# ============================================================
# PodDisruptionBudget - inventory-app
# Ensures at least 1 pod available during voluntary disruptions
# (node drain, cluster upgrade)
# ============================================================
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inventory-app-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: inventory-app
---
# ============================================================
# Istio Gateway - exposes inventory-app via istio-ingressgateway
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: inventory-app-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "*"
---
# ============================================================
# Istio DestinationRule - defines stable & canary subsets
# Argo Rollouts adds/removes pod-hash labels on these subsets
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: inventory-app-dr
spec:
  host: inventory-app
  subsets:
  - name: stable
    labels:
      app: inventory-app
  - name: canary
    labels:
      app: inventory-app
---
# ============================================================
# Istio VirtualService - routes traffic between subsets
# Weights below are managed by Argo Rollouts at each canary step
# ============================================================
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: inventory-app-vs
spec:
  hosts:
  - inventory-app
  - inventory-app.default.svc.cluster.local
  - inventory-app.local
  gateways:
  - inventory-app-gateway
  - mesh
  http:
  - name: primary
    route:
    - destination:
        host: inventory-app
        subset: stable
      weight: 100
    - destination:
        host: inventory-app
        subset: canary
      weight: 0
