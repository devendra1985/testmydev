# ============================================================
# MySQL Secret (base64 encoded credentials)
# To generate: echo -n 'yourvalue' | base64
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  mysql-root-password: cm9vdHBhc3N3b3Jk       # rootpassword
  mysql-database: aW52ZW50b3J5X2Ri             # inventory_db
  mysql-username: cm9vdA==                      # root
---
# ============================================================
# MySQL Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        ports:
          - containerPort: 3306
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        - name: MYSQL_DATABASE
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-database
        volumeMounts:
        - name: mysql-storage
          mountPath: /var/lib/mysql
      volumes:
      - name: mysql-storage
        emptyDir: {}
---
# ============================================================
# MySQL Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
  - port: 3306
    targetPort: 3306
  clusterIP: None
---
# ============================================================
# Spring Boot App Deployment
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-app
  template:
    metadata:
      labels:
        app: inventory-app
    spec:
      initContainers:
      - name: wait-for-mysql
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z mysql 3306; do echo "Waiting for MySQL..."; sleep 3; done; echo "MySQL is ready!"']
      containers:
      - name: inventory-app
        image: taledevendra/my-app:26
        ports:
          - containerPort: 8087
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:mysql://mysql:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
        - name: SPRING_DATASOURCE_USERNAME
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-username
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: mysql-root-password
        imagePullPolicy: Always
---
# ============================================================
# Spring Boot App Service
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: inventory-app
spec:
  type: NodePort
  selector:
    app: inventory-app
  ports:
  - port: 8087
    targetPort: 8087
    protocol: TCP
    name: http
