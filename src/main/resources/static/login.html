<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In – TestMyDev</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      padding: 20px;
      overflow: hidden;
    }

    /* Animated background blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    body::before {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #6c63ff, #3b82f6);
      top: -150px; left: -150px;
    }
    body::after {
      width: 400px; height: 400px;
      background: radial-gradient(circle, #f472b6, #8b5cf6);
      bottom: -120px; right: -120px;
      animation-delay: -4s;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(30px) scale(1.05); }
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 48px 40px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
      animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 32px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: linear-gradient(135deg, #6c63ff, #3b82f6);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .logo-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
    }

    h1 {
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 6px;
    }
    .subtitle {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 36px;
    }

    .field {
      position: relative;
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255,255,255,0.7);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }
    .input-wrap {
      position: relative;
    }
    .input-wrap .icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.35);
      pointer-events: none;
      font-size: 16px;
    }
    .field input {
      width: 100%;
      padding: 13px 14px 13px 42px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
      outline: none;
    }
    .field input::placeholder { color: rgba(255,255,255,0.25); }
    .field input:focus {
      border-color: #6c63ff;
      background: rgba(108,99,255,0.12);
      box-shadow: 0 0 0 3px rgba(108,99,255,0.25);
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: rgba(255,255,255,0.35);
      cursor: pointer;
      padding: 4px;
      font-size: 16px;
      transition: color 0.2s;
      width: auto;
    }
    .toggle-password:hover { color: rgba(255,255,255,0.7); }

    .options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .remember {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    .remember input[type="checkbox"] {
      width: 16px; height: 16px;
      accent-color: #6c63ff;
      cursor: pointer;
      margin: 0; padding: 0;
      border-radius: 4px;
    }
    .remember span {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }
    .forgot {
      font-size: 13px;
      color: #6c63ff;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .forgot:hover { color: #a78bfa; }

    .btn-login {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #6c63ff, #3b82f6);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      box-shadow: 0 4px 20px rgba(108,99,255,0.4);
      position: relative;
      overflow: hidden;
      letter-spacing: 0.3px;
    }
    .btn-login:hover { opacity: 0.9; box-shadow: 0 6px 28px rgba(108,99,255,0.55); }
    .btn-login:active { transform: scale(0.98); }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-login .spinner {
      display: none;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
    }
    .btn-login.loading .btn-text { display: none; }
    .btn-login.loading .spinner { display: block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .msg {
      margin-top: 18px;
      text-align: center;
      font-size: 13.5px;
      min-height: 20px;
      border-radius: 8px;
      padding: 0;
      transition: all 0.3s;
    }
    .msg.error {
      color: #fc8181;
      background: rgba(252,129,129,0.1);
      padding: 10px 14px;
      border: 1px solid rgba(252,129,129,0.2);
    }
    .msg.success {
      color: #68d391;
      background: rgba(104,211,145,0.1);
      padding: 10px 14px;
      border: 1px solid rgba(104,211,145,0.2);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }
    .divider span { font-size: 12px; color: rgba(255,255,255,0.3); }

    .btn-sso {
      width: 100%;
      padding: 13px;
      background: rgba(255,255,255,0.06);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      font-size: 15px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
      margin-bottom: 24px;
    }
    .btn-sso:hover {
      background: rgba(255,255,255,0.11);
      border-color: rgba(255,255,255,0.28);
    }
    .btn-sso img {
      width: 20px; height: 20px;
    }

    .footer {
      text-align: center;
      font-size: 14px;
      color: rgba(255,255,255,0.45);
    }
    .footer a {
      color: #6c63ff;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.2s;
    }
    .footer a:hover { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="logo-icon">⚡</div>
      <span class="logo-text">TestMyDev</span>
    </div>

    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="username">Username</label>
        <div class="input-wrap">
          <span class="icon">👤</span>
          <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <span class="icon">🔒</span>
          <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle-password" id="togglePwd" aria-label="Toggle password visibility">👁</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="rememberMe">
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">Sign In</span>
        <div class="spinner"></div>
      </button>
    </form>

    <div class="msg" id="msg"></div>

    <div class="divider"><span>or</span></div>

    <a href="/testmydev/saml2/authenticate/keycloak" class="btn-sso">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L2 7v10l10 5 10-5V7L12 2z" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linejoin="round"/>
        <path d="M12 2v20M2 7l10 5 10-5" stroke="rgba(255,255,255,0.8)" stroke-width="1.5" stroke-linejoin="round"/>
      </svg>
      Sign in with Keycloak SSO
    </a>

    <div class="footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>
  </div>

  <script>
    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('password');
      const btn = document.getElementById('togglePwd');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        btn.textContent = '🙈';
      } else {
        pwd.type = 'password';
        btn.textContent = '👁';
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      msg.className = 'msg';
      msg.textContent = '';

      if (!username || !password) {
        msg.className = 'msg error';
        msg.textContent = 'Please enter both username and password.';
        return;
      }

      btn.disabled = true;
      btn.classList.add('loading');

      try {
        const res = await fetch('/testmydev/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (res.ok) {
          localStorage.setItem('user', JSON.stringify({ username: data.username, name: data.name }));
          msg.className = 'msg success';
          msg.textContent = `Welcome back, ${data.name}! Redirecting…`;
          setTimeout(() => window.location.href = 'dashboard.html', 900);
        } else {
          msg.className = 'msg error';
          msg.textContent = data.message || 'Invalid credentials. Please try again.';
          btn.disabled = false;
          btn.classList.remove('loading');
        }
      } catch {
        msg.className = 'msg error';
        msg.textContent = 'Network error. Please check your connection.';
        btn.disabled = false;
        btn.classList.remove('loading');
      }
    });
  </script>
</body>
</html>
