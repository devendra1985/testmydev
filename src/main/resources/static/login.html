<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – TestMyDev</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
    h2 { margin-bottom: 24px; color: #333; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 16px; }
    input:focus { outline: none; border-color: #4a90e2; }
    button { width: 100%; padding: 12px; background: #4a90e2; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #357abd; }
    .msg { margin-top: 14px; text-align: center; font-size: 14px; }
    .msg.error { color: #e74c3c; }
    .msg.success { color: #27ae60; }
    .footer { margin-top: 20px; text-align: center; font-size: 13px; color: #777; }
    .footer a { color: #4a90e2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Sign In</h2>
    <form id="loginForm">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter username" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter password" required>

      <button type="submit">Login</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer">Don't have an account? <a href="signup.html">Sign up</a></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = '';

      const res = await fetch('/testmydev/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value,
          password: document.getElementById('password').value
        })
      });

      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg success';
        msg.textContent = `Welcome back, ${data.name}!`;
      } else {
        msg.className = 'msg error';
        msg.textContent = data.message;
      }
    });
  </script>
</body>
</html>
