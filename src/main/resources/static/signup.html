<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign Up – TestMyDev</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .card { background: #fff; padding: 40px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); width: 100%; max-width: 420px; }
    h2 { margin-bottom: 24px; color: #333; text-align: center; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #555; }
    input, textarea { width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; margin-bottom: 16px; font-family: inherit; }
    input:focus, textarea:focus { outline: none; border-color: #4a90e2; }
    textarea { resize: vertical; min-height: 70px; }
    button { width: 100%; padding: 12px; background: #27ae60; color: #fff; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    button:hover { background: #219150; }
    .msg { margin-top: 14px; text-align: center; font-size: 14px; }
    .msg.error { color: #e74c3c; }
    .msg.success { color: #27ae60; }
    .footer { margin-top: 20px; text-align: center; font-size: 13px; color: #777; }
    .footer a { color: #4a90e2; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create Account</h2>
    <form id="signupForm">
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="John Doe" required>

      <label for="username">Username</label>
      <input type="text" id="username" placeholder="johndoe" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="john@example.com" required>

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" required minlength="6">

      <label for="address">Address</label>
      <textarea id="address" placeholder="123 Main St, City, State"></textarea>

      <button type="submit">Create Account</button>
    </form>
    <div class="msg" id="msg"></div>
    <div class="footer">Already have an account? <a href="login.html">Sign in</a></div>
  </div>

  <script>
    document.getElementById('signupForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'msg';
      msg.textContent = '';

      const res = await fetch('/testmydev/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name:     document.getElementById('name').value,
          username: document.getElementById('username').value,
          email:    document.getElementById('email').value,
          password: document.getElementById('password').value,
          address:  document.getElementById('address').value
        })
      });

      const data = await res.json();
      if (res.ok) {
        msg.className = 'msg success';
        msg.textContent = 'Account created! Redirecting to login...';
        setTimeout(() => window.location.href = 'login.html', 1500);
      } else {
        msg.className = 'msg error';
        msg.textContent = data.message;
      }
    });
  </script>
</body>
</html>
