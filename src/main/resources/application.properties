# Server Configuration
server.port=8087
server.servlet.context-path=/testmydev
server.shutdown=graceful

# Application Configuration
spring.application.name=testmydev

# ============================================================
# MySQL Database Configuration
# Defaults to localhost for local dev; override via env vars in Kubernetes
# ============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/inventory_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Initialize database with schema.sql and data.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus,web
management.endpoints.web.discovery.enabled=true
management.endpoint.health.show-details=always
management.metrics.enable.jvm=true
management.metrics.enable.process.cpu=true
management.metrics.enable.system.cpu=true

# Logging Configuration
logging.level.com.example.testmydev=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Log all incoming HTTP requests (method, URI, status, duration)
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG
