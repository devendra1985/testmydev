# Test Configuration — uses H2 in-memory database (no MySQL needed)
server.port=8087
server.servlet.context-path=/testmydev

spring.application.name=testmydev

# H2 In-Memory Database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable SQL init scripts for tests (Hibernate handles schema)
spring.sql.init.mode=never
