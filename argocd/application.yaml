# ============================================================
# Argo CD Application - demosvc (Inventory App)
# GitOps: deploys the kustomize dev overlay from the separate
# config repo (testmydev-config) to the dev namespace.
# Kustomize is auto-detected from the kustomization.yaml at path.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demosvc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://github.com/devendra1985/testmydev-config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
