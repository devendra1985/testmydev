# ============================================================
# Argo CD Application - demosvc (Inventory App)
# Deploys kube/manf.yaml from Git to dev namespace
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demosvc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: dev
  source:
    repoURL: https://github.com/devendra1985/testmydev.git
    targetRevision: main
    path: kube
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - PruneLast=true
